# Sprite sheet config written by Sprite Sheet Processor, then finished by hand.
# image <file, relative to this config>
# facing left | right            which way the artwork faces (default right)
# anim <name> <frames> <frameWidth> <frameHeight> <rowY> <secondsPerFrame>
#   frame i of an animation is at x = i * frameWidth, y = rowY
#   the lines after an anim line belong to it:
#   loop | once                  repeat (default) or stop on the last frame
#   next <anim>                  animation to play after a once animation ends
#   hurt <x> <y> <w> <h>         body box in cell coordinates (here: the area every frame covers)
#   hit <i> <x> <y> <w> <h>      damage box on frame i

image ../Sprite sheets/enemies/bat_fixed.png
facing right

# Hanging upside down, wrapped in its wings, until someone comes close.
anim idle 1 17 23 0 0.1
hurt 0 0 17 23

# Opening its eyes.
anim wake 4 27 21 23 0.1
hurt 5 2 17 19
once
next fly

anim fly 2 41 24 44 0.1
hurt 5 0 31 23
