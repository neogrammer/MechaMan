# The intro highway (Assets\backgrounds\intro.png). Units are pixels of the picture.
# Format: see Content\Stage.h.
#
# The decks are solid from their road surface down to the bottom of the level, so the gaps
# between them are pits. Where the picture shows something below a gap (the old road, a low
# platform, a broken piece of deck), that is solid too: you land on it and wall-jump back up
# the deck's side, Mega Man X style. The two widest gaps are too far to jump across even with
# a dash jump; you go down to the low platform and climb.
#
# Where the feet go: the road band on every deck is drawn from its light top edge down to the
# road's front edge 7 rows lower, and the parked cars' tires end on the row just above that
# (the trucks' one row lower still). Alucard's feet are on the bottom row of his frames, so
# each surface's y below is its top edge + 7: his feet land on the tires' row. The two low
# platforms in the big gaps have no road on them, only a lit top face 3 rows deep, so theirs
# is their top edge + 3.
#
# Trucks, cars, lamp posts, the overpass, the towers and the robots built into the picture
# are scenery: you pass in front of them.

